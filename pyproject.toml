[project]
name = "aka-integration-hub"
version = "0.1.0"
description = "Aka Integration Hub backend workspace"
requires-python = ">=3.13,<3.15"
dependencies = ["aih-common", "aih-api", "aih-worker"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "testcontainers==4.15.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
    "cyclonedx-bom==7.6.0",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modules/common", "apps/api", "apps/worker"]

[tool.uv.sources]
aih-common = { workspace = true }
aih-api = { workspace = true }
aih-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["modules/common/tests", "apps/api/tests", "apps/worker/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["apps/api/tests"]
markers = ["integration: Docker (Testcontainers) gerektiren testler"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Kural setinin gerekçesi: docs/standards/PYTHON_CODING_STANDARDS.md
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "DTZ", "T20", "PIE", "PT", "RET", "SIM", "TID", "ARG",
    "PTH", "ERA", "PL", "TRY", "FBT", "SLF", "ISC", "PERF", "FURB", "LOG", "G", "BLE", "S", "ASYNC", "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Türkçe metinlerdeki karakterler bilinçli
    "PLR0913",                     # keyword-only parametreler serbest; positional sınır PLR0917 ile korunur
    "TRY003",                      # alan kodlu DomainError mesajları çağrı yerinde verilir
    "TRY301",
    "FBT003",                      # stdlib/üçüncü taraf API'lerine positional bool geçişi
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-positional-args = 5
max-returns = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["aih_common", "aih_api", "aih_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S104", "S105", "S106", "PLR2004", "ARG", "PLC0415", "SLF001", "FBT"]
"conftest.py" = ["S101", "S105", "S106", "PLC0415"]
"apps/api/migrations/**" = ["E501", "ERA001"]
"**/routes.py" = ["PLR0917", "FBT001"]  # FastAPI bağımlılık/sorgu parametreleri handler imzasında tanımlanır
"**/cli.py" = ["T201"]

[tool.coverage.run]
branch = true
source = ["aih_common", "aih_api", "aih_worker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
fail_under = 85

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["modules/common/src", "apps/api/src", "apps/worker/src"]
packages = ["aih_common", "aih_api", "aih_worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["aih_common", "aih_api", "aih_worker"]

[[tool.importlinter.contracts]]
name = "Ortak çekirdek uygulamalara bağımlı olamaz"
type = "forbidden"
source_modules = ["aih_common"]
forbidden_modules = ["aih_api", "aih_worker"]

[[tool.importlinter.contracts]]
name = "API ve worker birbirinden bağımsızdır"
type = "independence"
modules = ["aih_api", "aih_worker"]
