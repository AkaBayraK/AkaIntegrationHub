[project]
name = "aka-integration-hub"
version = "0.1.0"
description = "Aka Integration Hub backend workspace"
requires-python = ">=3.13,<3.15"
dependencies = ["aih-common", "aih-api", "aih-worker"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
    "testcontainers==4.15.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
    "cyclonedx-bom==7.6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["modules/common", "apps/api", "apps/worker"]

[tool.uv.sources]
aih-common = { workspace = true }
aih-api = { workspace = true }
aih-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["modules/common/tests", "apps/api/tests", "apps/worker/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["apps/api/tests"]
markers = ["integration: Docker (Testcontainers) gerektiren testler"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["aih_common", "aih_api", "aih_worker"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S104", "S105", "S106"]
"conftest.py" = ["S105", "S106"]
"apps/api/migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["modules/common/src", "apps/api/src", "apps/worker/src"]
packages = ["aih_common", "aih_api", "aih_worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["aih_common", "aih_api", "aih_worker"]

[[tool.importlinter.contracts]]
name = "Ortak çekirdek uygulamalara bağımlı olamaz"
type = "forbidden"
source_modules = ["aih_common"]
forbidden_modules = ["aih_api", "aih_worker"]

[[tool.importlinter.contracts]]
name = "API ve worker birbirinden bağımsızdır"
type = "independence"
modules = ["aih_api", "aih_worker"]
