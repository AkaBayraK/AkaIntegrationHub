[project]
name = "aih-worker"
version = "0.1.0"
description = "Aka Integration Hub asynchronous delivery worker"
requires-python = ">=3.13"
dependencies = ["aih-common", "aio-pika==10.2.2"]

[project.scripts]
aih-worker = "aih_worker.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aih_worker"]
