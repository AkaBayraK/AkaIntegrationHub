spring:
  application:
    name: aih-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AIH_DB_URL:jdbc:postgresql://localhost:25432/aih}
    username: ${AIH_DB_USER:aih}
    password: ${AIH_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: platform
  data:
    redis:
      host: ${AIH_VALKEY_HOST:localhost}
      port: ${AIH_VALKEY_PORT:26379}
      password: ${AIH_VALKEY_PASSWORD:}
      timeout: 2s
  rabbitmq:
    host: ${AIH_RABBITMQ_HOST:localhost}
    port: ${AIH_RABBITMQ_PORT:25672}
    username: ${AIH_RABBITMQ_USER:aih}
    password: ${AIH_RABBITMQ_PASSWORD:}
    virtual-host: ${AIH_RABBITMQ_VHOST:aih}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${AIH_API_PORT:28080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  server:
    port: ${AIH_API_MANAGEMENT_PORT:28081}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis,rabbit
  info:
    env:
      enabled: false

aih:
  platform:
    environment: ${AIH_ENVIRONMENT:local}

logging:
  structured:
    format:
      console: ${AIH_LOG_FORMAT:ecs}
