[project]
name = "aih-api"
version = "0.1.0"
description = "Aka Integration Hub API"
requires-python = ">=3.13"
dependencies = [
    "aih-common",
    "fastapi==0.162.0",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==8.1.0",
    "aio-pika==10.2.2",
    "pyjwt[crypto]==2.15.1",
    "cryptography==50.0.2",
    "aiosmtplib==5.1.3",
]

[project.scripts]
aih-api = "aih_api.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aih_api"]
