[project]
name = "aih-common"
version = "0.1.0"
description = "Aka Integration Hub shared core: correlation id, problem details, settings, logging"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "structlog==26.1.0",
    "starlette>=0.47,<2",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aih_common"]
