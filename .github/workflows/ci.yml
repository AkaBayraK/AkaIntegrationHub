name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.13, Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint, format, types, module boundaries
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run lint-imports
      - name: Test
        run: uv run pytest
      - name: Python SBOM (CycloneDX)
        run: uv run cyclonedx-py environment --of JSON -o python-bom.json .venv
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-python
          path: python-bom.json

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > npm-bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-npm
          path: npm-bom.json

  docs:
    name: Docs (local link check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true
