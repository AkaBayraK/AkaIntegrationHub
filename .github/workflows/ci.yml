name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, Testcontainers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.13'
          check-latest: true
          cache: maven
      - name: Block compromised eMudhra intermediates (CVE-2026-91403)
        run: |
          f="$JAVA_HOME/lib/security/blocked.certs"
          { echo 'Algorithm=SHA-256'; grep -hE '^[0-9A-F]{64}$' "$f" infra/security/emudhra-blocked.certs | sort -u; } > /tmp/blocked.certs
          cp /tmp/blocked.certs "$f"
          missing=$(comm -23 <(grep -E '^[0-9A-F]{64}$' infra/security/emudhra-blocked.certs | sort -u) <(grep -E '^[0-9A-F]{64}$' "$f" | sort -u) | wc -l)
          test "$missing" -eq 0
          java -version
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Maven SBOM (CycloneDX)
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-maven
          path: target/bom.json

  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: npm SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > npm-bom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-npm
          path: npm-bom.json

  docs:
    name: Docs (local link check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --exclude-path node_modules './**/*.md'
          fail: true
